[project]
name = "emsim"
version = "0.1.0"
description = "Interactive 3D electromagnetics simulator: Coulomb force, electric field, and potential"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyQt6>=6.7",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "PyOpenGL>=3.1.7",
]

[project.scripts]
emsim = "emsim.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emsim"]
